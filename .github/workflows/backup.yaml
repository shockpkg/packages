name: backup

on:
  workflow_dispatch:
    inputs:
      script:
        description: script
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Download
        run: curl -f -s -L -o /tmp/setup ${{ secrets.BACKUP_SETUP }}

      - name: Setup Chmod
        run: chmod +x /tmp/setup

      - name: Setup
        run: /tmp/setup

      - name: Bin Download
        run: curl -f -s -L -o ./bin/backup ${{ secrets.BACKUP_BIN }}

      - name: Bin Chmod
        run: chmod +x ./bin/backup

      - name: INI
        run: cat <<< "${BACKUP_INI}" > backup.ini
        env:
          BACKUP_INI: ${{ secrets.BACKUP_INI }}

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Dependencies
        run: npm ci

      - name: Script
        run: npm run ${{ inputs.script }}

      - name: Artifact packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: packages/

      - name: Artifact download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download
          path: _download/
