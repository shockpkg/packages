name: verify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        includes:
          - air-runtime
          - air-sdk
          - flash-player
          - flash-playerglobal
          - flex
          - gamingsdk
          - local-content-updater
          - shockwave-player
          - shockwave-projector

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify
        run: node ./bin/verify.js
        env:
          SHOCKPKG_VERIFY_INCLUDES: ${{ matrix.includes }}-
